<style id="base-css">
/* Layout: polar-chart navy masthead band, tab bar, then one record sheet per tab; capstone has its own sub-tabs. Owner-only edit bar pinned to the bottom. */
:root{
  --accent-base:#1f5f93; --band-base:#0f2438;
  --f-display:"Young Serif", Georgia, "Times New Roman", serif;
  --f-body:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:var(--f-body);
  --bg:#e0e0db; --sheet:#ffffff; --ink:#151a22; --muted:#4f5866; --line:#cfd0c8;
  --band:var(--band-base); --band-ink:#e8f0f6; --band-muted:#a7bccd;
  --accent:var(--accent-base); --accent-soft:color-mix(in srgb,var(--accent-base) 12%,#fff); --signal:#8a6a1f; --brass:#d9b866; --on-accent:#ffffff;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);font-weight:var(--display-weight,400);text-wrap:balance;margin:0;line-height:1.2}
p{margin:0;max-width:66ch}
a{color:var(--accent)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1040px;margin:0 auto}

.mast{background:var(--band);color:var(--band-ink);padding-block:40px 0;position:relative;overflow:hidden}
.mast canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.7;pointer-events:none;color:var(--band-muted)}
.mast .inner{position:relative;display:flex;flex-direction:column;gap:14px}
.coord{font-family:var(--f-body);font-weight:500;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--band-muted)}
.who{display:flex;gap:28px;align-items:center}
.who .ph{position:relative;flex:none}
.who .ph img{width:168px;height:168px;border-radius:50%;object-fit:cover;border:3px solid color-mix(in srgb,var(--band-ink) 25%,transparent);display:block}
.who>div{display:flex;flex-direction:column;gap:10px;min-width:0}
.mast h1{font-size:clamp(38px,6.5vw,64px);letter-spacing:-.01em;line-height:1.05}
.mast .sub{font-size:17px;opacity:.92;max-width:58ch}
@media (max-width:520px){.who{flex-direction:column;align-items:flex-start;gap:14px}.who .ph img{width:128px;height:128px}}
.clear{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;font:600 12.5px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--band);background:var(--brass);padding:5px 12px 5px 10px;border-radius:2px}
.clear::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--band)}
.mast.slim{padding-block:20px 0}
.slimrow{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.slimname{font-family:var(--f-display);font-weight:var(--display-weight,400);font-size:24px;color:var(--band-ink);text-decoration:none}
.slimname:hover{text-decoration:underline}
.focus{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.focus li{font:500 11.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border:1px solid color-mix(in srgb,var(--band-ink) 35%,transparent);color:var(--band-ink);border-radius:2px;display:inline-flex;gap:4px;align-items:center}
.comps{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:0 28px}
.comp{display:flex;flex-direction:column;gap:4px;padding:14px 0;border-top:1px solid var(--line);position:relative}
.comp h4{margin:0;font:600 15.5px var(--f-body)}
.comp p{font-size:14px;color:var(--muted)}
.comp .ev{font:500 11.5px var(--f-mono);letter-spacing:.04em;color:var(--signal);text-transform:uppercase}
.contact{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--band-muted);align-items:center}
.contact a{color:var(--band-ink)}
.contact .copy{border-color:color-mix(in srgb,var(--band-muted) 50%,transparent);color:var(--band-muted)}

nav.tabs{display:flex;gap:2px;margin-top:22px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{padding:11px 16px;text-decoration:none;color:var(--band-muted);font-weight:500;white-space:nowrap;border-radius:3px 6px 0 0}
nav.tabs a:hover{color:var(--band-ink)}
nav.tabs a[aria-current="page"]{background:var(--bg);color:var(--ink)}

main{padding-block:28px 56px}
.view{display:flex;flex-direction:column;gap:28px}
.eyebrow{font-family:var(--f-body);font-weight:600;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--signal)}
.head{display:flex;flex-direction:column;gap:6px}
.head h2{font-size:28px}
.lede{font-size:17px}
.intro{padding:clamp(24px,5vw,48px)}
.intro .head h2{font-size:clamp(28px,4vw,38px)}
.intro .lede{font-family:var(--f-display);font-size:clamp(20px,2.6vw,25px);line-height:1.4;max-width:40ch}
.intro p{max-width:60ch}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:3px;padding:clamp(18px,4vw,32px);display:flex;flex-direction:column;gap:20px;min-width:0}
.sheet h3{font-size:19px}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}

.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.door{display:flex;flex-direction:column;gap:8px;padding:20px;background:var(--sheet);border:1px solid var(--line);border-radius:3px;text-decoration:none;color:var(--ink);transition:border-color .15s,transform .15s}
a.door:hover{border-color:var(--accent);transform:translateY(-2px)}
.door h3{font-size:20px}
.door p{color:var(--muted);font-size:14px}
.door .go{margin-top:auto;font-size:13.5px;font-weight:600;color:var(--accent)}
.door.feature{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px;align-items:center}
.door.feature img{border-radius:3px;border:1px solid var(--line);width:100%;height:220px;object-fit:cover;object-position:top;display:block}
@media (max-width:640px){.door.feature{grid-template-columns:1fr}}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
.fact{display:flex;flex-direction:column}
.fact b{font-family:var(--f-display);font-weight:var(--display-weight,400);font-size:21px;color:var(--accent)}
.fact span{font-size:13px;color:var(--muted)}

.subtabs{display:flex;flex-wrap:wrap;gap:6px}
.subtab{font:inherit;font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:7px 14px;border-radius:2px;border:1px solid var(--line);background:var(--sheet);color:var(--muted);cursor:pointer}
.subtab:hover{color:var(--ink);border-color:var(--accent)}
.subtab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{border-left:2px solid var(--signal);padding:2px 0 2px 12px;display:flex;flex-direction:column}
.stat b{font-family:var(--f-display);font-weight:var(--display-weight,400);font-size:28px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}

.threat{border-left:3px solid var(--signal);background:color-mix(in srgb,var(--signal) 8%,var(--sheet));padding:14px 18px;border-radius:0 6px 6px 0;display:flex;flex-direction:column;gap:6px}
.threat p{font-family:var(--f-display);font-size:clamp(19px,2.4vw,23px);line-height:1.35;max-width:52ch}
.textlink{font:600 13.5px var(--f-body);background:none;border:0;padding:0;color:var(--accent);cursor:pointer;align-self:flex-start}
.textlink:hover{text-decoration:underline}
.built{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.built li{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-top:1px solid var(--line);position:relative}
.built li:first-child{border-top:0;padding-top:0}
.built b{font-weight:600}
.built span{font-size:14px;color:var(--muted)}
.bluf{border-left:3px solid var(--signal);background:color-mix(in srgb,var(--signal) 8%,var(--sheet));padding:14px 18px;border-radius:0 6px 6px 0;display:flex;flex-direction:column;gap:6px}
.bluf p{font-size:16.5px;max-width:70ch}
.drivers{display:flex;flex-direction:column}
.driver{display:grid;grid-template-columns:190px minmax(0,1fr);gap:6px 24px;padding:16px 0;border-top:1px solid var(--line);position:relative;align-items:start}
.driver:first-child{border-top:0;padding-top:0}
.driver h4{margin:0;font:600 16px var(--f-body)}
.driver p{font-size:14.5px;color:var(--muted)}
@media (max-width:560px){.driver{grid-template-columns:1fr}}
.response{border:1px solid var(--line);border-radius:3px;padding:14px 18px;display:flex;flex-direction:column;gap:6px;background:var(--accent-soft)}
.role{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px;align-items:start;padding:22px;border:1px solid var(--line);border-radius:3px;background:color-mix(in srgb,var(--accent) 5%,var(--sheet))}
@media (max-width:700px){.role{grid-template-columns:1fr}}
.role video{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:3px;border:1px solid var(--line);background:#000}
.status{align-self:flex-start;font:600 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);padding:3px 10px;border-radius:2px;margin-top:4px}
.dlrow{display:inline-flex;flex-wrap:wrap;align-items:center;gap:8px}
.btn.dl{font-size:13.5px;padding:6px 14px;background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.mast .btn.dl{background:var(--brass);border-color:var(--brass);color:var(--band)}
.dlmsg{font-size:12.5px;color:var(--muted)}
.mast .dlmsg{color:var(--band-muted)}
.reshead{flex-direction:row;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.hero{justify-content:space-between;gap:32px}
.hero .ph img{width:240px;height:240px;border-radius:50%;border-width:4px}
@media (max-width:760px){.hero{flex-direction:column-reverse;align-items:flex-start}.hero .ph img{width:150px;height:150px}}
.mast .sub{font-size:clamp(17px,2vw,20px)}
#home.view{gap:0}
.sec{display:flex;flex-direction:column;gap:20px;padding-block:40px;border-top:1px solid var(--line)}
.sec:first-child{border-top:0;padding-top:12px}
.sechead{display:flex;flex-direction:column;gap:4px}
.sechead h2{font-size:clamp(24px,3vw,30px)}
.about2{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:16px 40px}
.about2 .lede{font-family:var(--f-display);font-size:clamp(19px,2.2vw,22px);line-height:1.45}
@media (max-width:760px){.about2{grid-template-columns:1fr}}
.interests{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:28px 24px}
.interest{display:flex;flex-direction:column;gap:6px;position:relative}
.interest h4{margin:0;font:600 16px var(--f-body)}
.interest p{font-size:14px;color:var(--muted)}
.ico{width:40px;height:40px;fill:none;stroke:var(--accent);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;margin-bottom:4px}
.works{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:16px}
.work{display:flex;flex-direction:column;background:var(--sheet);border:1px solid var(--line);border-radius:3px;overflow:hidden;text-decoration:none;color:var(--ink);position:relative;transition:border-color .15s,transform .15s}
a.work:hover{border-color:var(--accent);transform:translateY(-3px)}
.wimg{position:relative;aspect-ratio:16/10;background:var(--bg);overflow:hidden}
.wimg img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.wbody{display:flex;flex-direction:column;gap:6px;padding:16px 18px 18px;flex:1}
.wbody h3{font-size:20px}
.wbody p{font-size:14px;color:var(--muted)}
.wbody .go,.sec .go{margin-top:auto;font-size:13.5px;font-weight:600;color:var(--accent);text-decoration:none}
.two-col{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:32px 48px;align-items:start}
.two-col>.col{gap:16px}
.snap{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.snap li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 12px;padding:12px 0;border-top:1px solid var(--line)}
.snap li:first-child{border-top:0;padding-top:0}
.snap b{font-weight:600}
.snap span{grid-column:1;font-size:14px;color:var(--muted)}
.snap em{grid-column:2;grid-row:1;font-style:normal;font-size:12.5px;color:var(--muted);white-space:nowrap}
.beyondlist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.beyondlist li{display:flex;flex-direction:column;gap:2px;padding-left:14px;border-left:2px solid var(--brass,var(--signal));position:relative}
.beyondlist span{font-size:14px;color:var(--muted)}
.contactend{padding-bottom:8px}
.contactrow{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
.poster-frame{border:1px solid var(--line);border-radius:3px;overflow:hidden;background:var(--bg);position:relative}
.poster-frame img{display:block;width:100%;cursor:zoom-in}
.poster-frame.zoom{overflow:auto;max-height:80vh}
.poster-frame.zoom img{width:220%;max-width:none;cursor:zoom-out}
.poster-bar{font-size:13px;color:var(--muted)}

.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;counter-reset:s}
.steps li{counter-increment:s;border-top:2px solid var(--accent);padding-top:10px;display:flex;flex-direction:column;gap:4px;position:relative}
.steps .phase{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.steps b{font-weight:600}
.steps span{font-size:14px;color:var(--muted)}

.skillgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.skill{border:1px solid var(--line);border-radius:3px;padding:16px;display:flex;flex-direction:column;gap:8px;position:relative}
.skill h3{font-size:17px}
.skill p{font-size:14px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;list-style:none;padding:0;margin:0}
.tags li{font-size:12.5px;padding:2px 9px;border-radius:2px;background:var(--accent-soft);color:var(--accent);display:inline-flex;gap:4px;align-items:center}
figure{margin:0;display:flex;flex-direction:column;gap:8px}
figure .imgwrap{position:relative}
figure img{border-radius:3px;border:1px solid var(--line);display:block;width:100%}
figcaption{font-size:13px;color:var(--muted)}

.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px}
.people>div{position:relative}
.people ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.label{font-family:var(--f-body);font-weight:600;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

.entries{display:flex;flex-direction:column}
.entry{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 22px;padding:18px 0;border-top:1px solid var(--line);position:relative}
.entry:first-child{border-top:0;padding-top:0}
@media (max-width:560px){.entry{grid-template-columns:1fr}}
.when{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);padding-top:3px;font-variant-numeric:tabular-nums}
.org{color:var(--muted);font-size:14px}
.entry ul,.plain{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.entry p{font-size:14px;color:var(--muted)}
.more{font-size:13.5px;font-weight:600}

.certs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.cert{border:1px solid var(--line);border-radius:3px;padding:16px;display:flex;flex-direction:column;gap:6px;background:var(--sheet);position:relative}
.cert h3{font-size:16.5px}
.cert .issuer{font-size:13.5px;color:var(--muted)}
.cert .area{margin-top:auto;padding-top:8px;border-top:1px dashed var(--line)}
.cert.award{border-color:var(--signal)}

.copy{font:inherit;font-size:12px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:4px;padding:0 7px;cursor:pointer}
.copy:hover{color:var(--accent);border-color:var(--accent)}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- Edit mode ---------- */
body.editing{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
body.editing [data-p]{outline:1px dashed color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px;border-radius:2px;min-width:2ch;cursor:text}
body.editing [data-p]:focus{outline:2px solid var(--accent);background:var(--accent-soft)}
body.editing .mast [data-p]{outline-color:color-mix(in srgb,var(--band-ink) 45%,transparent)}
body.editing .mast [data-p]:focus{background:color-mix(in srgb,var(--band-ink) 12%,transparent)}
.ctl{font:600 12px var(--f-body);border:1px solid var(--line);background:var(--sheet);color:var(--muted);border-radius:4px;padding:3px 8px;cursor:pointer;line-height:1.3}
.ctl:hover{color:var(--ink);border-color:var(--accent)}
.ctl.add{align-self:flex-start;color:var(--accent);border-style:dashed}
.ctl.rm{position:absolute;top:6px;right:6px;z-index:2}
.ctl.x{position:static;padding:0 5px;font-size:11px;line-height:1.4}
.ctl.img{position:absolute;left:8px;bottom:8px;z-index:2;background:var(--sheet)}
.urlrow{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.urlrow [data-p]{overflow-wrap:anywhere}
.entry .ctl.rm,.skill .ctl.rm,.cert .ctl.rm,.people .ctl.rm{top:0;right:0}
.cert .ctl.rm,.skill .ctl.rm{top:8px;right:8px}
li .ctl.x{margin-left:6px}

.editbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--sheet);border-top:1px solid var(--line);box-shadow:0 -6px 24px color-mix(in srgb,var(--ink) 10%,transparent);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(12px + env(safe-area-inset-bottom,0px))}
.editbar .inner{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.editbar label{display:flex;flex-direction:column;gap:3px;font-size:11px;font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.editbar select{font:14px var(--f-body);padding:5px 8px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink);max-width:180px}
.editbar input[type=color]{width:44px;height:32px;padding:2px;border:1px solid var(--line);border-radius:5px;background:var(--bg);cursor:pointer}
.editbar .spacer{flex:1}
.btn{font:600 14px var(--f-body);padding:8px 16px;border-radius:3px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn:disabled{opacity:.55;cursor:default}
.editbar .msg{font-size:13px;color:var(--muted);flex-basis:100%}

/* ---------- masthead rings ---------- */
function drawGrid(){
  var cv = document.getElementById("grid"); if (!cv) return;
  var r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1, ctx = cv.getContext && cv.getContext("2d"); if (!ctx) return;
  cv.width = r.width * d; cv.height = r.height * d; ctx.setTransform(d,0,0,d,0,0);
  var col = getComputedStyle(cv).color || "#9fb4c7", wide = r.width > 700;
  var cx = wide ? r.width * .84 : r.width * .9, cy = r.height * .1, step = wide ? 64 : 48, i;
  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 1;
  /* parallels every 5 degrees from the pole, labelled like a polar chart */
  for (i = 1; i <= 9; i++){
    ctx.globalAlpha = i % 2 ? .22 : .38; ctx.setLineDash(i % 2 ? [2,4] : []);
    ctx.beginPath(); ctx.arc(cx, cy, i * step, 0, Math.PI * 2); ctx.stroke();
    if (i % 2 === 0 && wide){ ctx.setLineDash([]); ctx.globalAlpha = .55; ctx.font = "500 10px " + getComputedStyle(document.body).fontFamily;
      var a = Math.PI * .62; ctx.fillText((90 - i * 5) + "°N", cx + Math.cos(a) * i * step + 4, cy + Math.sin(a) * i * step); }
  }
  ctx.setLineDash([]);
  /* meridians every 30 degrees */
  ctx.globalAlpha = .16;
  for (i = 0; i < 12; i++){ var m = i * Math.PI / 6; ctx.beginPath(); ctx.moveTo(cx + Math.cos(m) * step * .5, cy + Math.sin(m) * step * .5); ctx.lineTo(cx + Math.cos(m) * step * 10, cy + Math.sin(m) * step * 10); ctx.stroke(); }
  /* pole mark */
  ctx.globalAlpha = .6; ctx.beginPath(); ctx.moveTo(cx - 5, cy); ctx.lineTo(cx + 5, cy); ctx.moveTo(cx, cy - 5); ctx.lineTo(cx, cy + 5); ctx.stroke();
  ctx.globalAlpha = 1;
}

/* ---------- images ---------- */
var LIMITS = { photo: [360, true], poster: [1500, false], model: [900, false] };
function pickImage(key){
  var inp = document.createElement("input"); inp.type = "file"; inp.accept = "image/*";
  inp.onchange = function(){
    var f = inp.files && inp.files[0]; if (!f) return;
    var rd = new FileReader();
    rd.onload = function(){
      var im = new Image();
      im.onload = function(){
        var lim = LIMITS[key] || [1000, false], cv = document.createElement("canvas"), sx = 0, sy = 0, sw = im.width, sh = im.height;
        if (lim[1]){ var s = Math.min(sw, sh); sx = (sw - s) / 2; sy = (sh - s) / 2.6; sw = sh = s; cv.width = cv.height = Math.min(lim[0], s); }
        else { var sc = Math.min(1, lim[0] / sw); cv.width = Math.round(sw * sc); cv.height = Math.round(sh * sc); }
        cv.getContext("2d").drawImage(im, sx, sy, sw, sh, 0, 0, cv.width, cv.height);
        S.images[key] = cv.toDataURL("image/jpeg", 0.8); render(); msg("Image replaced. Save to keep it.");
      };
      im.onerror = function(){ msg("That file couldn't be read as an image. Try a JPG or PNG."); };
      im.src = rd.result;
    };
    rd.readAsDataURL(f);
  };
  inp.click();
}

    rd.readAsDataURL(f);
  };
  inp.click();
}

var DEFAULTS = {
  news: { when: "Month 2026", title: "New milestone", text: "A sentence about what happened.", link: "" },
  experience: { when: "Year – Year", title: "Job title", org: "Organization · City, ST", bullets: ["What you did and the result."] },
  education: { when: "Year", title: "Degree or program", org: "School · City, ST", bullets: ["Detail"] },
  certs: { kind: "Certification", name: "Certification name", issuer: "Issuing organization · Year", tags: ["Tag"] },
  skills: { t: "Skill", d: "Where this skill shows up in the project.", tags: ["Tool"] },
  steps: { t: "Phase name", d: "What happens in this phase." },
  stats: { v: "00", l: "What the number means" },
  built: { t: "Deliverable", d: "What it is and what it does." },
  drivers: { v: "00", l: "What the number measures", t: "Driver", d: "What this shows and why it matters." },
  implications: { t: "Area", d: "What is at risk." },
  outcomes: { t: "Outcome", d: "What it means." },
  role: { t: "Contribution", d: "What you did and what it produced." },
  interests: { icon: "data", t: "Interest area", d: "One line on what draws you to it." },
  featured: { kicker: "Project", t: "Project title", d: "One line on what it is.", go: "View project →", img: "poster", sub: "ov" },
  beyond: { t: "Role", d: "Organization and what you do." },
  items: { t: "Competency", d: "What you can do.", ev: "Where you've shown it" },
  facts: { v: "Highlight", l: "Short description" },
  team: { label: "Group", items: ["Name"] }
};
document.addEventListener("click", function(e){
  var el;
  if (editing && e.target.closest("[data-p]") && e.target.closest("nav.tabs, .subtab, .door")){ e.preventDefault(); return; }
  if ((el = e.target.closest("[data-gosub]")) && !editing){ sub = el.dataset.gosub; if (location.hash === "#capstone"){ e.preventDefault(); render(); window.scrollTo(0, 0); } return; }
  if ((el = e.target.closest("[data-sub]"))){ sub = el.dataset.sub; render(); return; }
  if (e.target.id === "posterImg" && !editing){ var fr = document.getElementById("posterFrame"); if (fr) fr.classList.toggle("zoom"); return; }
  if ((el = e.target.closest(".copy"))){
    var done = function(){ el.textContent = "Copied"; setTimeout(function(){ el.textContent = "Copy"; }, 1400); };
    try { navigator.clipboard.writeText(el.dataset.copy).then(done, function(){ el.textContent = "Select it"; }); } catch (_){ el.textContent = "Select it"; }
    return;
  }
  if (e.target.id === "dlResume"){ saveResume(); return; }
  if (e.target.id === "startEdit"){ editing = true; render(); return; }
  if (e.target.id === "cancelEdit"){ S = JSON.parse(SAVED); editing = false; applyTheme(); render(); return; }
  if (e.target.id === "saveEdit"){ save(); return; }
  if (!editing) return;
  if ((el = e.target.closest("[data-rm]"))){ var arr = get(el.dataset.rm); arr.splice(+el.dataset.i, 1); render(); return; }
  if ((el = e.target.closest("[data-add]"))){
    var path = el.dataset.add, a = get(path), key = path.split(".").pop();
    var def = (a.length && typeof a[0] === "string") ? "New item" : (DEFAULTS[key] || (a.length ? clone(a[a.length - 1]) : "New item"));
    a.push(clone(def)); render(); return;
  }
  if ((el = e.target.closest("[data-img]"))){ pickImage(el.dataset.img); return; }
  if ((el = e.target.closest("[data-vid]"))){ pickVideo(el.dataset.vid); return; }
  if ((el = e.target.closest("[data-pdf]"))){ pickPdf(el.dataset.pdf); return; }
});
document.addEventListener("input", function(e){
  var el = e.target.closest && e.target.closest("[data-p]");
  if (el && editing){ set(el.dataset.p, el.innerText.replace(/\n+$/, "")); return; }
  if (e.target.id === "ed-accent"){ S.theme.accent = e.target.value; applyTheme(); }
  if (e.target.id === "ed-band"){ S.theme.band = e.target.value; applyTheme(); drawGrid(); }
});
document.addEventListener("change", function(e){
  if (e.target.id === "ed-display"){ S.theme.display = e.target.value; applyTheme(); }
  if (e.target.id === "ed-body"){ S.theme.body = e.target.value; applyTheme(); }
});
document.addEventListener("keydown", function(e){
  var el = e.target.closest && e.target.closest("[data-p]");
  if (el && e.key === "Enter"){ e.preventDefault(); el.blur(); }
});
window.addEventListener("hashchange", function(){ render(); window.scrollTo(0, 0); });
window.addEventListener("resize", drawGrid);
window.addEventListener("beforeunload", function(e){ if (editing && JSON.stringify(S) !== SAVED){ e.preventDefault(); e.returnValue = ""; } });

applyTheme(); render();

})();
</script>
</body></html>
